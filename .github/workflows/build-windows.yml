name: Build Ezcan Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install computer dependencies
        run: python -m pip install -r files\computer\requirements.txt

      - name: Run computer tests
        run: python -m pytest files\computer -q

      - name: Build Windows executable
        run: python make_ezcan_exe.py --no-pause

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "EzcanComputer.exe")) {
            throw "EzcanComputer.exe was not created"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ezcan-windows-exe
          path: EzcanComputer.exe
          if-no-files-found: error
          retention-days: 30
