name: Build Ezcan iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: >-
          xcodebuild
          -project Ezcan.xcodeproj
          -scheme Ezcan
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath device-build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ezcan-ipa/Payload"
          cp -R device-build/Build/Products/Release-iphoneos/Ezcan.app "$RUNNER_TEMP/ezcan-ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ezcan-ipa/Payload" Ezcan-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcan-ios-ipa
          path: Ezcan-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
