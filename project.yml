name: Ezcan
options:
  bundleIdPrefix: com.undu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Ezcan:
    type: application
    platform: iOS
    sources:
      - path: Ezcan
    resources:
      - path: ezcan_logo.png
      - path: Ezcan/Resources/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.undu.ezcan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Ezcan"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Ezcan uses the camera to photograph Pokemon cards."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ezcan uses the microphone when recording card videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ezcan uses your photo library to send card media to your computer."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Ezcan connects to your computer over your private Wi-Fi network."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
    scheme:
      gatherCoverageData: false
      testTargets: []
